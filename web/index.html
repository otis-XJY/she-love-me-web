<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TA回我了 - 微信恋爱分析</title>
  <link rel="stylesheet" href="styles.css?v=20260424-9">
</head>
<body>
  <header class="top-nav">
    <a class="brand-lockup" href="/" aria-label="TA回我了首页">
      <span class="brand-name">TA回我了</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <button class="nav-item active" data-step="main"><span>I.</span>分析主线</button>
      <button class="nav-item" data-step="archive"><span>II.</span>角色档案</button>
      <button class="nav-item" data-step="personality"><span>III.</span>恋爱人格</button>
      <button class="nav-item" data-step="settings"><span>IV.</span>设置</button>
    </nav>
    <div class="runtime-pill" id="runtimeStatus"><i></i><span>读取状态中</span></div>
  </header>

  <main class="app-shell">
    <section class="stage">
      <section class="hero-panel">
        <h2 id="panelTitle">分析主线</h2>
      </section>

      <section class="panes">
        <article class="pane visible" id="pane-main">
          <section class="workflow-board">
            <div class="workflow-card">
              <h3>扫描微信</h3>
              <div class="actions">
                <button class="primary" id="discoverBtn">一键识别微信</button>
                <button class="secondary" id="loadContactsBtn">读取联系人</button>
              </div>
            </div>

            <div class="workflow-card">
              <h3>角色选择</h3>
              <div class="contact-toolbar">
                <label class="search-field">
                  <span>搜索联系人</span>
                  <input id="contactSearch" type="search" placeholder="输入姓名或微信号">
                </label>
                <button class="secondary" id="contactsRefreshBtn">刷新</button>
              </div>
              <div class="contact-list compact" id="contactList"></div>
              <div class="actions sticky-actions">
                <button class="primary" id="extractBtn" disabled>提取并统计</button>
              </div>
            </div>

            <div class="workflow-card">
              <h3>潜台词扫描</h3>
              <div class="actions">
                <button class="secondary" id="analyzeBtn">生成分析</button>
                <button class="primary" id="reportBtn">生成报告</button>
              </div>
              <pre class="preview" id="analysisPreview">尚未生成分析。</pre>
            </div>
          </section>

          <section class="report-panel">
            <div class="report-head">
              <div>
                <h3>结果分析报告</h3>
              </div>
              <a class="secondary link-button disabled" id="openReport" href="#" aria-disabled="true">独立打开</a>
            </div>
            <div class="report-slot" id="reportSlot">暂无报告。</div>
            <div class="report-stage" id="reportStage">
              <div class="report-empty">报告会在这里显示。</div>
              <div id="reportMount"></div>
            </div>
          </section>
        </article>

        <article class="pane" id="pane-archive">
          <div class="archive-grid" id="archives"></div>
        </article>

        <article class="pane" id="pane-personality">
          <section class="personality-panel">
            <div class="quiz-progress">
              <span>第 III 题</span>
              <strong>3 / 10</strong>
              <div><i></i></div>
            </div>
            <h4>对方三个小时后回“刚忙完”，你的第一反应是？</h4>
            <div class="quiz-grid">
              <button class="quiz-option"><span>I.</span>松一口气。TA只是忙，逻辑合理。</button>
              <button class="quiz-option"><span>II.</span>怀疑。谁会刚好忙到这个点？</button>
              <button class="quiz-option"><span>III.</span>无所谓。我还没看手机。</button>
              <button class="quiz-option"><span>IV.</span>慌。先在备忘录写三版回复。</button>
            </div>
          </section>
        </article>

        <article class="pane" id="pane-settings">
          <div class="actions">
            <button class="secondary" id="setupBtn">运行环境检查</button>
          </div>
          <section class="config-panel">
            <div>
              <h4>接口设置</h4>
              <p>API Key 只保存在当前本地服务进程内，不写入项目文件。</p>
            </div>
            <div class="config-grid">
              <label>
                <span>接口模式</span>
                <select id="llmProvider">
                  <option value="openai">OpenAI</option>
                  <option value="anthropic">Anthropic</option>
                  <option value="gemini">Gemini</option>
                </select>
              </label>
              <label>
                <span>BaseURL</span>
                <input id="llmBaseUrl" type="url" placeholder="https://api.openai.com/v1">
              </label>
              <label>
                <span>模型</span>
                <input id="llmModel" type="text" placeholder="gpt-4.1">
              </label>
              <label class="config-key">
                <span>API Key</span>
                <input id="llmApiKey" type="password" autocomplete="off" placeholder="粘贴后自动隐藏">
              </label>
              <button class="primary" id="saveConfigBtn">保存配置</button>
            </div>
            <p class="config-hint" id="configHint">尚未读取模型配置。</p>
          </section>
          <section class="theme-panel">
            <h4>颜色风格</h4>
            <div class="theme-grid">
              <button class="theme-choice active" data-theme="neon"><span>I.</span>霓虹紫</button>
              <button class="theme-choice" data-theme="cyan"><span>II.</span>电光蓝</button>
              <button class="theme-choice" data-theme="ember"><span>III.</span>暖焰橙</button>
            </div>
          </section>
        </article>
      </section>

      <section class="console-wrap" id="consoleWrap">
        <div class="console-head" id="consoleHead">
          <span>后台记录</span>
          <strong id="logLatest">等待后台动作。</strong>
          <button class="text-button" id="clearLog">清空</button>
        </div>
        <pre id="log" class="console"></pre>
      </section>
    </section>
  </main>

  <footer class="footer">
    <strong>TA回我了</strong>
    <a href="https://github.com/Exekiel179/she-love-me-web" target="_blank" rel="noreferrer">github.com/Exekiel179/she-love-me-web</a>
  </footer>

  <script src="app.js?v=20260424-9"></script>
</body>
</html>
